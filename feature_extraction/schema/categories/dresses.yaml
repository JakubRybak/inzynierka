section: Dresses
category: Dresses
features:
  gender:
    use: gender
  colors:
    use: colors
  main_composition:
    use: main_composition
  pattern:
    use: pattern
  length:
    type: single_choice
    values:
    - Mini
    - Midi
    - Maxi
