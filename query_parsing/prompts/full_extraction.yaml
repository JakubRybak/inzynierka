equals_set_base: '''only'', ''exclusively'', ''pure'', ''100% <material>'' (''100% cotton'' -> equals_set [''Cotton''])'
equals_set_lining_suffix: ', or ''unlined'' (lining_composition equals_set [''Unlined''])'
system_template: |-
  You convert a shopping query (in English, Polish, or Spanish) for the ALREADY selected category '{category}' into hard catalog filters for '{category}' and a list of residual ranking concepts.
  The category '{category}' is fixed. Use ONLY the features and exact allowed values defined for '{category}'.

  OUTPUT FORMAT
  Return JSON with exactly 'filters' and 'residual'.
  - Categorical filters: {{"feature": "<feature>", "operator": "<op>", "values": ["<label>", ...]}}
  - Price filters: {{"feature": "price", "operator": "lte" | "gte" | "around", "value": <number>}}
  - Residual: ["<concept 1>", ...] (empty array [] when no residual concepts remain).

  FILTER RULES FOR {category_upper}
  1. Extract only requirements explicitly expressed in the query. Never infer unmentioned features from the garment category or from another feature.
  2. Single-choice features ({single_feats}) and 'brand' use 'in' (positive, OR for multiple values) and 'not_in' (explicit exclusions).
  3. Multi-choice / composition features ({multi_feats}) use:
     - 'contains_any': single requested value, OR alternatives ('cotton or linen'), or material percentage between 0% and 100% ('30% wool').
     - 'contains_all': conjunctions requiring all listed values together ('cotton and elastane').
     - 'contains_none': explicit exclusions ('without polyester', '0% wool').
     - 'equals_set': exact set required via {equals_set_examples}.
  4. Colors use exact sets:
     - 'black' or 'all-black': equals_set ['Black'].
     - 'black and white' or 'black and white and orange': equals_set with all named color families.
     - 'black or white': equals_any_set ['Black', 'White']. Each value is a separate singleton alternative.
     - 'no red': contains_none ['Red']. An excluded shade stays in residual.
  5. Positive and negative clauses on the same feature are separate filter objects combined with AND.
  6. Brand: use conventional brand capitalization (e.g. 'Nike', 'Adidas', 'Calvin Klein', 'Levi\'s', 'Under Armour', 'ASICS'). 'Off-White' in 'by Off-White' is a brand; 'off-white' as a color is a shade (White + residual 'off-white').
  7. Price: preserve decimal numbers, ignore currency symbols/names without conversion:
     - up to / under / below / less than / at most / do / <= X -> 'lte'
     - at least / over / above / more than / minimum / od / >= X -> 'gte'
     - between X and Y / from X to Y -> two clauses: 'gte' X and 'lte' Y
     - around X / approximately X / za około X -> 'around'
     Never treat sizes ('2x', '34 x 28', '20'), pack counts, model numbers ('501'), or material percentages as prices.

  RESIDUAL RULES FOR {category_upper}
  1. Residual is a list of strings (one string per independent concept, in query order, preserving the query's language).
  2. Omit the '{category}' garment category noun, and omit requirements fully captured by filters (basic colors, materials, percentages, brands, prices, currencies, genders, fits, lengths).
  3. KEEP in residual any specific sub-concept that is narrower than the assigned catalog filter bucket:
     - Specific color shades map to their color family filter AND stay in residual: 'turquoise' (Blue), 'navy' / 'navy blue' / 'azul marino' / 'granatowy' (Blue), 'azul celeste' / 'jasnoniebieski' (Blue), 'burgundy' / 'maroon' / 'bordowy' (Red), 'olive' / 'forest green' / 'khaki' / 'emerald' (Green), 'hot pink' / 'fuchsia' / 'coral' (Pink), 'heather grey' / 'charcoal' (Grey), 'off-white' / 'cream' / 'ivory' (White), 'camel' (Brown), 'mustard' (Yellow), 'lavender' / 'lilac' (Purple). (Basic color words like 'blue', 'black', 'white', 'red', 'green', 'grey', 'pink', 'brown', 'yellow', 'purple', 'orange', 'beige' do NOT go to residual.)
     - Excluded shade ('not turquoise', 'not emerald') stays in residual with NO color filter.
  {substyle_lines}
  4. Keep unsupported attributes in residual: sizes ('2x', '3xl', '34 x 28', 'tall', 'plus', 'big and tall'), target age ('boys', 'girls', 'kids', 'unisex'), fabric/construction details ('soft', 'lace', 'faux leather', 'stretch', 'with pockets', 'quilted', 'ribbed', 'fleece'), occasions ('for hiking', 'for work', 'for summer'), and graphics/themes ('star wars', 'nirvana', 'vintage', 'boho').

  SUPPORTED FEATURES AND DEFINITIONS FOR {category_upper}
  {defs_text}

  FEW-SHOT EXAMPLES (Category: {category})
  {examples_text}
user_template: |-
  Category: {category}
  Query: {query}
