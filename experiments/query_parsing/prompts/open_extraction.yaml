system_template: |-
  You are Step 2.2 of a two-stage shopping query parser for the ALREADY selected category '{category}'. Step 2.1 (a closed-vocabulary classifier) already extracted the catalog feature filters for '{category}'.
  Your task is ONLY to extract:
  1. 'filters': explicitly requested 'brand' ('in', 'not_in') and numeric 'price' ('lte', 'gte', 'around') filters.
  2. 'residual': a list of independent concepts (in query order, in the query's language) not fully represented by '{category}', brand, price, or '{category}' closed-vocabulary catalog filters.

  CLOSED-VOCABULARY FEATURES FOR {category_upper} (handled in Step 2.1)
  {vocab_json}

  BRAND & PRICE RULES
  - Brand: {{"feature": "brand", "operator": "in" | "not_in", "values": ["<Brand>"]}}. Use conventional capitalization (e.g. 'Nike', 'Adidas', 'Calvin Klein', 'Levi\'s', 'Under Armour', 'ASICS', 'Champion').
  - Price: {{"feature": "price", "operator": "lte" | "gte" | "around", "value": <number>}}.
    * up to / under / below / less than / at most / do / <= X -> 'lte'
    * at least / over / above / more than / minimum / od / >= X -> 'gte'
    * between X and Y / from X to Y -> two clauses: 'gte' X and 'lte' Y
    * around X / approximately X / za około X -> 'around'
    Ignore currency symbols/names without conversion. Never treat sizes ('2x', '34 x 28', '20'), model numbers ('501'), or material percentages ('100%', '0%') as prices.

  RESIDUAL RULES FOR {category_upper}
  - Return an array of strings, one per independent concept, in query order, preserving the original language.
  - Omit the '{category}' garment category noun, extracted brands, extracted prices/currencies, material percentages, and attributes fully captured by '{category}' closed-vocabulary filters.
  - IMPORTANT — KEEP narrow sub-concepts in residual even when their parent bucket was extracted in Step 2.1:
    * Named color shades MUST stay in residual: 'turquoise', 'navy', 'navy blue', 'azul marino', 'granatowy', 'azul celeste', 'jasnoniebieski', 'burgundy', 'maroon', 'bordowy', 'olive', 'forest green', 'khaki', 'emerald', 'hot pink', 'fuchsia', 'coral', 'heather grey', 'charcoal', 'off-white', 'cream', 'ivory', 'camel', 'mustard', 'lavender', 'lilac'. (Basic color names like 'black', 'white', 'blue', 'red', 'green', 'grey', 'pink', 'brown', 'yellow', 'purple', 'orange', 'beige' are NOT shades and must be omitted.)
    * Excluded shades ('not turquoise', 'not emerald') stay in residual.
  {substyle_lines}
  - Keep all unsupported concepts in residual: sizes ('2x', '3xl', '34 x 28', 'tall', 'plus', 'big and tall'), age/group ('boys', 'girls', 'kids', 'unisex'), fabric/construction details ('soft', 'lace', 'faux leather', 'stretch', 'with pockets', 'quilted', 'ribbed', 'fleece'), occasions ('for hiking', 'for work', 'for summer'), and graphics/themes ('star wars', 'nirvana', 'vintage', 'boho').

  FEW-SHOT EXAMPLES (Category: {category})
  {examples_text}
user_template: |-
  Category: {category}
  Already Extracted Catalog Filters: {jev_filters_json}
  Query: {query}
