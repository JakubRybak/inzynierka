# Mock parser responses in the LLM parser output format (queries from example_queries.yaml).

# T-shirts
"white t-shirt":
  category: T-shirts
  filters:
    - {feature: colors, operator: contains_any, values: [White]}
"black oversized cotton t-shirt for men":
  category: T-shirts
  filters:
    - {feature: gender, operator: in, values: [Men]}
    - {feature: colors, operator: contains_any, values: [Black]}
    - {feature: main_composition, operator: contains_any, values: [Cotton]}
    - {feature: fit, operator: in, values: [Oversized]}
"floral or striped t-shirt":
  category: T-shirts
  filters:
    - {feature: pattern, operator: in, values: [Floral, Striped]}
"long sleeve t-shirt without polyester":
  category: T-shirts
  filters:
    - {feature: sleeve_length, operator: in, values: [Long Sleeve]}
    - {feature: main_composition, operator: contains_none, values: [Polyester]}
"only cotton grey t-shirt":
  category: T-shirts
  filters:
    - {feature: main_composition, operator: equals_set, values: [Cotton]}
    - {feature: colors, operator: contains_any, values: [Grey]}
"t-shirt with a skull print":
  category: T-shirts
  residual: with a skull print
"biała koszulka z długim rękawem":
  category: T-shirts
  filters:
    - {feature: colors, operator: contains_any, values: [White]}
    - {feature: sleeve_length, operator: in, values: [Long Sleeve]}

# Dresses
"black midi dress":
  category: Dresses
  filters:
    - {feature: colors, operator: contains_any, values: [Black]}
    - {feature: length, operator: in, values: [Midi]}
"black silk slip dress":
  category: Dresses
  filters:
    - {feature: colors, operator: contains_any, values: [Black]}
    - {feature: main_composition, operator: contains_any, values: [Silk]}
    - {feature: dress_type, operator: contains_any, values: [Slip]}
"wrap or shirt dress":
  category: Dresses
  filters:
    - {feature: dress_type, operator: contains_any, values: [Wrap, Shirt Dress]}
"maxi dress not black":
  category: Dresses
  filters:
    - {feature: length, operator: in, values: [Maxi]}
    - {feature: colors, operator: contains_none, values: [Black]}
"red dress with ruffles":
  category: Dresses
  filters:
    - {feature: colors, operator: contains_any, values: [Red]}
  residual: with ruffles
"lace dress for an evening party":
  category: Dresses
  residual: lace dress for an evening party
"czarna sukienka na wesele":
  category: Dresses
  filters:
    - {feature: colors, operator: contains_any, values: [Black]}
  residual: na wesele

# Tank tops & Camisoles
"white tank top":
  category: Tank tops & Camisoles
  filters:
    - {feature: colors, operator: contains_any, values: [White]}
"black and white striped tank top":
  category: Tank tops & Camisoles
  filters:
    - {feature: colors, operator: contains_all, values: [Black, White]}
    - {feature: pattern, operator: in, values: [Striped]}
"black or white racerback tank top":
  category: Tank tops & Camisoles
  filters:
    - {feature: colors, operator: contains_any, values: [Black, White]}
    - {feature: strap_style, operator: in, values: [Racerback]}
"men's tank top not black":
  category: Tank tops & Camisoles
  filters:
    - {feature: gender, operator: in, values: [Men]}
    - {feature: colors, operator: contains_none, values: [Black]}
"only cotton tank top for women":
  category: Tank tops & Camisoles
  filters:
    - {feature: gender, operator: in, values: [Women]}
    - {feature: main_composition, operator: equals_set, values: [Cotton]}
"silk camisole with lace trim":
  category: Tank tops & Camisoles
  filters:
    - {feature: main_composition, operator: contains_any, values: [Silk]}
  residual: with lace trim
"ribbed tank top for summer":
  category: Tank tops & Camisoles
  residual: ribbed tank top for summer
