<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic search</title>
<style>
:root { color-scheme:light; --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --card:#fff; --acc:#1d4ed8; --soft:#f5f5f4;
        --hl:#fef3c7; --hlfg:#78350f; --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
        --c-parse:#7c3aed; --c-filter:#0f766e; --c-rank:#1d4ed8;
        --k-is:#15803d; --k-is-bg:#dcfce7; --k-not:#b91c1c; --k-not-bg:#fee2e2; --k-cat:#0e7490;
        --k-con:#6d28d9; --k-con-bg:#ede9fe;
        --p-emb:#60a5fa; --p-con:#8b5cf6; --p-col:#f59e0b; --p-det:#14b8a6; --p-neg:#ef4444; }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
.app { display:grid; grid-template-columns:400px minmax(0, 1fr); min-height:100vh; }
.app.fopen { grid-template-columns:400px minmax(0, 1fr) 320px; }
.side { position:sticky; top:0; height:100vh; overflow:auto; border-right:1px solid var(--line); padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.results { padding:14px 16px 40px; min-width:0; }
.resbar { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
.resbar #status { margin:0; }
#ftoggle { padding:4px 12px; font-size:13px; }
#ftoggle.on { border-color:var(--acc); color:var(--acc); }
#ftoggle .badge { display:inline-block; min-width:18px; margin-left:4px; padding:0 5px; border-radius:9px; background:var(--okbg); color:var(--ok); font-size:11px; font-weight:700; }
@media (max-width: 800px) { .app, .app.fopen { grid-template-columns:1fr; } .side { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); }
  #filters { position:static; height:auto; } }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
#q { font:inherit; font-size:15px; line-height:1.35; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); flex:1 1 200px; min-width:0; resize:none; }
select, button { font:inherit; padding:7px 11px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
button.go { background:var(--acc); color:var(--bg); border-color:var(--acc); padding:8px 16px; }
.meta { color:var(--mut); font-size:12px; }
.options { display:grid; grid-template-columns:62px minmax(0, 1fr); gap:6px 8px; align-items:center; }
.options select { width:100%; padding:5px 8px; font-size:13px; }
.lbl { color:var(--mut); font-size:12px; }
.cats { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:4px; }
.cats button { height:30px; padding:2px 4px; font-size:11.5px; line-height:1.1; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
.cats button:hover { border-color:var(--acc); }
.cats button.on { border-color:var(--acc); background:var(--acc); color:var(--bg); font-weight:600; }
.cond { margin:4px 0; display:flex; flex-wrap:wrap; gap:5px; align-items:center; font-size:13px; }
.leaf { background:var(--soft); border:1px solid var(--line); border-radius:5px; padding:1px 7px; }
.leaf b { font-weight:600; }
.leaf.k-is, .leaf.k-not { border-color:transparent; }
.leaf.k-is { background:var(--k-is-bg); color:var(--k-is); } .op.k-is { color:var(--k-is); }
.leaf.k-not { background:var(--k-not-bg); color:var(--k-not); } .op.k-not { color:var(--k-not); }
.leaf.k-cat { background:transparent; border:1.5px solid var(--k-cat); color:var(--k-cat); font-weight:600; }
.op { color:var(--acc); font-weight:700; font-size:11px; letter-spacing:.04em; }
.lines { display:grid; grid-template-columns:auto minmax(0, 1fr); column-gap:6px; row-gap:4px; align-items:center; margin:4px 0; }
.lines > .op { text-align:right; white-space:nowrap; }
.lines > .cond { margin:0; }
.paren { color:var(--mut); }
.sec { border:1px solid var(--line); border-radius:8px; background:var(--card); padding:10px 12px; font-size:12px; }
.sec.busy { opacity:.55; }
.sec h3 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); }
.sec h3 span { text-transform:none; letter-spacing:0; font-weight:500; }
.kv { display:grid; grid-template-columns:58px minmax(0, 1fr); gap:7px 8px; align-items:baseline; font-size:13px; }
.kv > .k { color:var(--mut); font-size:12px; }
.ph { margin:0 0 6px; line-height:1.4; }
.ph:last-child { margin-bottom:0; }
.ph .said { font-weight:600; }
.how { color:var(--mut); font-size:11px; }
.tl { display:grid; grid-template-columns:104px minmax(0, 1fr) 58px; gap:7px 8px; align-items:center; }
.tl .track { position:relative; height:10px; background:var(--soft); border-radius:3px; }
.tl .track i { position:absolute; top:0; bottom:0; min-width:2px; border-radius:3px; }
.tl .v { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.tl .skip { grid-column:2/-1; color:var(--mut); }
.tl .sum { border-top:1px solid var(--line); padding-top:6px; font-weight:700; }
.tlx { margin-top:8px; color:var(--mut); font-size:11px; line-height:1.5; }
.c-parse { background:var(--c-parse); } .c-step1 { background:#a78bfa; } .c-filter { background:var(--c-filter); }
.c-rank { background:var(--c-rank); } .c-emb { background:var(--p-emb); } .c-jev { background:#ea580c; }
#filters { display:none; position:sticky; top:0; height:100vh; overflow:auto; border-left:1px solid var(--line); background:var(--card); padding:14px 16px; font-size:12px; }
.app.fopen #filters { display:block; }
#filters .fclose { float:right; padding:0 8px; font-size:16px; line-height:20px; }
#filters select { width:100%; margin:2px 0 8px; padding:5px 8px; }
#filters .reset { width:100%; padding:4px; font-size:12px; margin-bottom:8px; }
.facet { border-top:1px solid var(--line); padding:7px 0; }
.fh { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px; }
.fh b { font-size:12px; }
.fh select { width:auto; margin:0; padding:1px 4px; font-size:11px; }
.vals { display:flex; flex-wrap:wrap; gap:4px; }
.val { font-size:11px; padding:1px 6px; border-radius:4px; }
.val .n { color:var(--mut); margin-left:3px; }
.val.zero { opacity:.45; }
.val.in { background:var(--okbg); color:var(--ok); border-color:transparent; font-weight:600; }
.val.out { background:var(--badbg); color:var(--bad); border-color:transparent; font-weight:600; text-decoration:line-through; }
#residualq { width:100%; font:inherit; font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); resize:vertical; }
.brandq { width:100%; font:inherit; font-size:12px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); margin-bottom:4px; }
#notes { margin-bottom:8px; }
.warn { background:var(--hl); color:var(--hlfg); border-radius:6px; padding:6px 10px; margin:6px 0; font-size:13px; }
.errorbox { background:var(--badbg); color:var(--bad); border-radius:6px; padding:8px 12px; margin:6px 0; }
#status { margin:4px 0 8px; font-size:14px; }
#status b { font-weight:600; }
.banner { background:var(--hl); color:var(--hlfg); border-radius:6px; padding:8px 12px; margin-bottom:10px; }
.grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; }
.p { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; cursor:pointer; }
.p:hover { border-color:var(--acc); }
#panel { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:10; }
#panel.on { display:block; }
#panel .box { position:absolute; right:0; top:0; bottom:0; width:min(560px, 100%); background:var(--bg); overflow:auto; padding:20px; border-left:1px solid var(--line); }
#panel h2 { font-size:16px; margin:0 0 4px; }
#panel table { border-collapse:collapse; width:100%; font-size:13px; margin-top:12px; }
#panel td { border-bottom:1px solid var(--line); padding:5px 4px; vertical-align:top; }
#panel td:first-child { color:var(--mut); width:40%; }
#panel tr.on td:last-child { color:var(--ok); font-weight:600; }
.photos { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:6px; margin:12px 0 0; }
.photo-frame { isolation:isolate; overflow:hidden; aspect-ratio:3/5; background:#f4f3f7; }
.photo-frame img { display:block; width:100%; height:100%; object-fit:cover; }
.photos .photo-frame { border-radius:6px; border:1px solid var(--line); }
.close { float:right; }
.desc { margin:12px 0 0; font-size:13px; line-height:1.5; }
.p .t { padding:7px 9px 9px; font-size:12px; }
.p .t > b { font-size:13px; }
.p .sc { position:absolute; z-index:1; top:6px; right:6px; background:rgba(0,0,0,.65); color:#fff; border-radius:4px; padding:1px 6px; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
.p .sc.jv { background:#c2410c; }
.p .nr { position:absolute; z-index:1; top:6px; left:6px; background:rgba(0,0,0,.65); color:#fff; border-radius:4px; padding:1px 6px; font-size:12px; font-weight:600; }
.chips { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
.chip { font-size:11px; border-radius:4px; padding:0 5px; background:var(--okbg); color:var(--ok); font-weight:600; }
.chip.cc { background:var(--k-con-bg); color:var(--k-con); }
#panel h3 { font-size:13px; margin:16px 0 0; }
.empty { color:var(--mut); padding:40px 0; text-align:center; }
.loading { grid-column:1/-1; display:flex; justify-content:center; padding:80px 0; }
.spinner { width:36px; height:36px; border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.parts .pr { display:grid; grid-template-columns:minmax(0, 1fr) 46px; gap:2px 8px; align-items:center; margin:3px 0; }
.parts .pr .lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.parts .pr .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--mut); }
.parts .pr .bar { grid-column:1/-1; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; }
.parts .pr .bar i { display:block; height:100%; border-radius:3px; }
.k-emb { background:var(--p-emb); } .k-con { background:var(--p-con); } .k-col { background:var(--p-col); }
.k-det { background:var(--p-det); } .k-neg { background:var(--p-neg); }
.sbar { position:relative; height:8px; margin-top:6px; background:var(--soft); border-radius:4px; overflow:hidden; }
.sbar i { position:absolute; top:0; bottom:0; }
.sbar .zero { position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--mut); }
.chip.dt { background:#ccfbf1; color:#0f766e; }
.chip.jv { background:#ffedd5; color:#c2410c; }
.swatch { display:inline-block; width:14px; height:14px; border:1px solid #999; vertical-align:middle; margin-right:4px; border-radius:3px; }
.dlist { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.dlist .chip { font-weight:500; }
.dlist .chip.on { outline:2px solid var(--p-det); }
.viewswitch { position:fixed; top:20px; left:16px; z-index:5; display:flex; padding:2px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
.viewswitch button { border:0; border-radius:999px; padding:4px 12px; font-size:12px; background:transparent; color:var(--mut); }
.viewswitch button.on { background:var(--fg); color:var(--bg); }
body:not(.view-dev) .app, body.view-dev .clean { display:none; }
/* in dev, a strip at the top of the side panel keeps its content from scrolling under the switch */
body.view-dev .side { padding-top:0; }
body.view-dev .side::before { content:""; position:sticky; top:0; z-index:3; flex:0 0 48px; margin:0 -16px; background:var(--bg); }
.clean { padding:12px 12px 40px; }
/* the search bar stays at the top while the results scroll, like the switch */
.cbar { position:sticky; top:12px; z-index:4; display:flex; justify-content:center; margin:0 0 14px; pointer-events:none; }
#cq { pointer-events:auto; width:min(640px, 100%); font:inherit; font-size:16px; padding:11px 22px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); box-shadow:0 2px 10px rgba(0,0,0,.10); outline:none; }
#cq:focus { border-color:var(--acc); }
.cgrid { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; }
.cp { cursor:pointer; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.cp:hover { border-color:#a8a29e; }
.cp .name { padding:8px 10px 10px; text-align:center; font-size:14px; font-weight:600; line-height:1.3; letter-spacing:-.005em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
/* Parsed: what the parser understood, one row of chips that stays under the search bar */
.cread { position:sticky; top:66px; z-index:4; pointer-events:none; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 22px;
  width:fit-content; max-width:min(1100px, 100%); margin:-6px auto 14px; padding:7px 18px; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 2px 10px rgba(0,0,0,.10); }
.cread:empty, body:not(.view-parsed) .cread { display:none; }
.cread > div { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.cread h4 { margin:0; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); }
.cread .vs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; }
.cread .cond { margin:0; font-size:13px; }
.cread .rp { background:var(--k-con-bg); color:var(--k-con); border-radius:5px; padding:1px 8px; }
.cnote { grid-column:1/-1; color:var(--mut); text-align:center; padding:40px 0; }
@media (max-width: 920px) { .cbar { margin-top:44px; } }
@media (max-width: 1000px) { .cgrid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cgrid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
</style></head><body>
<div id="panel"><div class="box" id="box"></div></div>
<div class="viewswitch" id="viewswitch"><button type="button" data-view="clean">Clean</button><button type="button" data-view="parsed">Parsed</button><button type="button" data-view="dev">Dev</button></div>
<div class="clean">
  <form class="cbar" id="cf"><input id="cq" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search"></form>
  <div class="cread" id="cread"></div>
  <div class="cgrid" id="cgrid"></div>
</div>
<div class="app" id="app">
  <aside class="side">
    <form class="row" id="f">
      <textarea id="q" rows="2" placeholder="e.g. black midi dress" autocomplete="off"></textarea>
      <button class="go" type="submit">Search</button>
    </form>
    <div class="options"><span class="lbl">Ranking</span><select id="ranking"></select></div>
    <div class="cats" id="cats"></div>
    <div class="options"><span class="lbl">Example</span><select id="examples"></select></div>
    <div class="sec" id="reading" hidden></div>
    <div class="sec parts" id="score" hidden></div>
    <div class="sec" id="timings"><div class="meta">Type a query or pick an example.</div></div>
  </aside>
  <main class="results">
    <div class="resbar"><div id="status"></div><button type="button" id="ftoggle">Filters</button></div>
    <div id="notes"></div>
    <div id="banner"></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside id="filters"></aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => Number(n).toLocaleString("en-US");
const fmtMs = v => v === undefined || v === null ? "–" : v >= 1000 ? (v / 1000).toFixed(2) + " s"
  : (v < 10 ? v.toFixed(1) : num(Math.round(v))) + " ms";
const RANKING_NAMES = {hybrid: "Hybrid", hybrid_jev_vision: "Hybrid + Jev vision", sentences_jev_vision: "Sentences + Jev vision"};
const rankingName = r => RANKING_NAMES[r] || r;
const MODES = {any: "any of", all: "all of", exact: "only"};
const COLOR_MODES = {exact: "only these colors", exactAny: "only one of these colors"};
const INCLUDE = {in: "any", contains_any: "any", contains_all: "all", equals_set: "exact", equals_any_set: "exactAny"};
const MULTI_OPERATORS = {any: "contains_any", all: "contains_all", exact: "equals_set", exactAny: "equals_any_set"};
const defaultMode = feature => feature === "colors" ? "exact" : "any";
const EXCLUDE = new Set(["not_in", "contains_none"]);
const noCache = {cache: "no-store"};
let INFO = null, D = null, PARSED = null, seq = 0, SCALE = 1;
// clean: the search bar and the results as a shopper sees them; parsed: the same with the category, filters and
// residual the parser found; dev: what the pipeline did. All show the same search.
const START = new URLSearchParams(location.search);
let VIEW = ["parsed", "dev"].includes(START.get("view")) ? START.get("view") : "clean";
const PRICE_OPS = {lt: "<", lte: "≤", gt: ">", gte: "≥", eq: "="};
let PANEL = {category: null, sel: {}, mode: {}, prices: [], residual: []}, brandQuery = "", applyTimer = null;

fetch("/api/info", noCache).then(r => r.json()).then(d => {
  INFO = d;
  d.rankings.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = rankingName(r); $("ranking").appendChild(o); });
  $("ranking").value = d.ranking;
  const groups = Object.keys(d.examples);
  groups.forEach(g => { const b = document.createElement("button"); b.type = "button"; b.textContent = b.title = g; b.dataset.g = g;
    b.onclick = () => showGroup(g); $("cats").appendChild(b); });
  if (groups.length) showGroup(groups[0]);
  drawPanel();
  if (d.rankings.includes(START.get("ranking"))) $("ranking").value = START.get("ranking");
  if (START.get("q")) { $("q").value = START.get("q"); search(); }
});
function showGroup(g) {
  [...$("cats").querySelectorAll("button")].forEach(b => b.classList.toggle("on", b.dataset.g === g));
  const qs = INFO.examples[g];
  $("examples").innerHTML = `<option value="" disabled selected>${esc(g)}: ${qs.length} ${qs.length === 1 ? "query" : "queries"}</option>` +
    qs.map(q => `<option>${esc(q)}</option>`).join("");
}
$("examples").onchange = e => { $("q").value = e.target.value; search(); };
$("f").onsubmit = e => { e.preventDefault(); search(); };
$("cf").onsubmit = e => { e.preventDefault(); $("q").value = $("cq").value; search(); };
$("viewswitch").querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.view));
setView(VIEW);

function setView(v) {
  if (v === "dev" && VIEW !== "dev") $("q").value = $("cq").value;
  if (v !== "dev" && VIEW === "dev") $("cq").value = $("q").value.trim();
  VIEW = v; document.body.className = `view-${v}`;
  $("viewswitch").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  updateUrl(); $(v === "dev" ? "q" : "cq").focus();
}

// the ranking and the view go into the address only when they are not the defaults, so a reload keeps the defaults
function updateUrl() {
  if (!INFO) return;
  const u = new URLSearchParams(), q = $("q").value.trim();
  if (q) u.set("q", q);
  if ($("ranking").value !== INFO.ranking) u.set("ranking", $("ranking").value);
  if (VIEW !== "clean") u.set("view", VIEW);
  history.replaceState(null, "", u.toString() ? `?${u}` : location.pathname);
}
$("q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); search(); } };
$("ranking").onchange = () => { if (D) search(D.parsed && D.parsed.source === "manual" ? panelFilters() : null); };

function panelFromParsed(p) {
  PANEL = {category: p && p.category || null, sel: {}, mode: {}, prices: [], residual: [...(p && p.residual || [])]};
  (p && p.filters || []).forEach(f => {
    if (f.feature === "price") { PANEL.prices.push({...f}); return; }
    const s = PANEL.sel[f.feature] = PANEL.sel[f.feature] || {};
    if (EXCLUDE.has(f.operator)) f.values.forEach(v => s[v] = "out");
    else { f.values.forEach(v => s[v] = "in"); const mode = INCLUDE[f.operator];
      PANEL.mode[f.feature] = f.feature === "colors" && (mode === "any" || mode === "all")
        ? (mode === "any" && f.values.length > 1 ? "exactAny" : "exact")
        : mode || defaultMode(f.feature); }
  });
}
function applySoon() { clearTimeout(applyTimer); applyTimer = setTimeout(() => search(panelFilters()), 250); }
function panelFilters() {
  const filters = [];
  (INFO.facets[PANEL.category] || []).forEach(fc => {
    if (fc.kind === "number") return;
    const s = PANEL.sel[fc.feature] || {};
    const ins = Object.keys(s).filter(v => s[v] === "in"), outs = Object.keys(s).filter(v => s[v] === "out");
    const multi = fc.kind === "multi", mode = PANEL.mode[fc.feature] || defaultMode(fc.feature);
    if (ins.length) filters.push({feature: fc.feature, values: ins,
      operator: multi ? MULTI_OPERATORS[mode] : "in"});
    if (outs.length) filters.push({feature: fc.feature, values: outs, operator: multi ? "contains_none" : "not_in"});
  });
  // features the panel does not show (not in the category schema) keep their parser filters
  const shown = new Set((INFO.facets[PANEL.category] || []).map(fc => fc.feature));
  (PARSED && PARSED.category === PANEL.category ? PARSED.filters : [])
    .filter(f => f.feature !== "price" && !shown.has(f.feature)).forEach(f => filters.push({...f}));
  filters.push(...PANEL.prices.filter(p => p.value !== "").map(p => ({...p})));
  return {category: PANEL.category, filters, residual: PANEL.residual};
}
function toggleFilters() {
  $("app").classList.toggle("fopen");
  $("ftoggle").classList.toggle("on", $("app").classList.contains("fopen"));
}
$("ftoggle").onclick = toggleFilters;

function drawPanel() {
  if (!INFO) return;
  const cats = Object.keys(INFO.facets);
  let h = `<button type="button" class="fclose" id="fclose" title="Close">×</button><h2>Filters</h2><div class="meta">Category</div><select id="pcat"><option value="">— none —</option>` +
    cats.map(c => `<option ${c === PANEL.category ? "selected" : ""}>${esc(c)}</option>`).join("") + `</select>` +
    (PARSED ? `<button type="button" class="reset" id="reset">Reset to parser</button>` : "");
  if (!PANEL.category) h += `<div class="meta">The parser picks the category and the filters; you can change them here.</div>`;
  else h += `<div class="meta">Click a value: include → exclude → off.</div>` +
    `<div class="facet"><b>Residual</b><div class="meta">One phrase per line; shown and passed on, the ranking uses the whole query.</div>` +
    `<textarea id="residualq" rows="2">${esc(PANEL.residual.join("\n"))}</textarea></div>`;
  (INFO.facets[PANEL.category] || []).forEach(fc => {
    if (fc.kind === "number") {
      h += `<div class="facet"><b>Price</b><div class="meta">Amounts compared directly; currencies are not converted.</div>` +
        PANEL.prices.map((p, i) => `<div style="display:flex;gap:6px;align-items:center;margin:6px 0">` +
          `<select data-price-op="${i}" aria-label="Price comparison ${i + 1}" style="width:60px;margin:0">` +
          Object.entries(PRICE_OPS).map(([op, label]) => `<option value="${op}" ${op === p.operator ? "selected" : ""}>${esc(label)}</option>`).join("") +
          `</select><input type="number" min="0" step="any" data-price-value="${i}" aria-label="Price amount ${i + 1}" value="${esc(p.value)}" style="width:100%;min-width:0">` +
          `<button type="button" data-price-remove="${i}" aria-label="Remove price condition ${i + 1}">×</button></div>`).join("") +
        `<button type="button" id="add-price">Add price condition</button></div>`;
      return;
    }
    const s = PANEL.sel[fc.feature] || {};
    // values chosen by the parser that no indexed product has: shown with 0, they keep the filter strict
    let values = fc.values.concat(Object.keys(s).filter(v => !fc.values.some(([x]) => x === v)).map(v => [v, 0]));
    if (fc.feature === "brand") {
      const q = brandQuery.toLowerCase();
      values = values.filter(([v]) => s[v] || (q ? v.toLowerCase().includes(q) : true)).slice(0, q ? 60 : 15);
    }
    h += `<div class="facet"><div class="fh"><b>${esc(fc.feature)}</b>` +
      (fc.kind === "multi" ? `<select data-mode="${esc(fc.feature)}">` + Object.entries(fc.feature === "colors" ? COLOR_MODES : MODES).map(([m, t]) =>
        `<option value="${m}" ${(PANEL.mode[fc.feature] || defaultMode(fc.feature)) === m ? "selected" : ""}>${t}</option>`).join("") + `</select>` : "") +
      `</div>` + (fc.feature === "brand" ? `<input class="brandq" id="brandq" placeholder="search ${num(fc.values.length)} brands" value="${esc(brandQuery)}">` : "") +
      `<div class="vals">` + values.map(([v, n]) =>
        `<button type="button" class="val ${s[v] || ""} ${n ? "" : "zero"}" data-f="${esc(fc.feature)}" data-v="${esc(v)}">${esc(v)}<span class="n">${num(n)}</span></button>`).join("") +
      `</div></div>`;
  });
  $("filters").innerHTML = h;
  const active = Object.values(PANEL.sel).reduce((n, s) => n + Object.keys(s).length, 0) + PANEL.prices.filter(p => p.value !== "").length;
  $("ftoggle").innerHTML = `Filters${active ? `<span class="badge">${active}</span>` : ""}`;
  $("fclose").onclick = toggleFilters;
  $("pcat").onchange = e => { PANEL = {category: e.target.value || null, sel: {}, mode: {}, prices: PANEL.prices, residual: PANEL.residual}; drawPanel(); if (PANEL.category) applySoon(); };
  if ($("residualq")) $("residualq").onchange = e => {
    PANEL.residual = [...new Set(e.target.value.split("\n").map(x => x.trim()).filter(Boolean))]; applySoon();
  };
  if ($("add-price")) $("add-price").onclick = () => { PANEL.prices.push({feature: "price", operator: "lte", value: ""}); drawPanel(); };
  $("filters").querySelectorAll("[data-price-op]").forEach(el => el.onchange = () => {
    const clause = PANEL.prices[Number(el.dataset.priceOp)];
    clause.operator = el.value; if (clause.value !== "") applySoon();
  });
  $("filters").querySelectorAll("[data-price-value]").forEach(el => el.onchange = () => {
    if (!el.checkValidity()) { el.reportValidity(); return; }
    const value = el.value === "" ? "" : Number(el.value);
    if (value !== "" && (!Number.isFinite(value) || value < 0)) return;
    PANEL.prices[Number(el.dataset.priceValue)].value = value; applySoon();
  });
  $("filters").querySelectorAll("[data-price-remove]").forEach(el => el.onclick = () => {
    PANEL.prices.splice(Number(el.dataset.priceRemove), 1); drawPanel(); applySoon();
  });
  $("filters").querySelectorAll(".val").forEach(b => b.onclick = () => {
    const s = PANEL.sel[b.dataset.f] = PANEL.sel[b.dataset.f] || {}, v = b.dataset.v;
    s[v] = s[v] === "in" ? "out" : s[v] === "out" ? undefined : "in";
    if (!s[v]) delete s[v];
    drawPanel(); applySoon();
  });
  $("filters").querySelectorAll("select[data-mode]").forEach(sel => sel.onchange = () => { PANEL.mode[sel.dataset.mode] = sel.value; drawPanel(); applySoon(); });
  if ($("brandq")) $("brandq").oninput = e => { brandQuery = e.target.value; const pos = e.target.selectionStart; drawPanel();
    $("brandq").focus(); $("brandq").setSelectionRange(pos, pos); };
  if ($("reset")) $("reset").onclick = () => { panelFromParsed(PARSED); drawPanel(); applySoon(); };
}

async function search(manual = null) {
  const q = $("q").value.trim(); if (!q && !manual) return;
  const mine = ++seq;
  const opts = `ranking=${encodeURIComponent($("ranking").value)}`;
  $("cq").value = q; updateUrl();
  $("timings").classList.add("busy");
  $("status").innerHTML = $("banner").innerHTML = $("notes").innerHTML = "";
  $("cread").innerHTML = "";
  $("grid").innerHTML = $("cgrid").innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  let url = `/api/search?q=${encodeURIComponent(q)}&${opts}`;
  if (manual) url += `&filters=${encodeURIComponent(JSON.stringify(manual))}`;
  let d;
  try {
    d = await (await fetch(url, noCache)).json();
  } catch (e) {
    d = {query: q, timings: {}, error: {stage: "connection to the server", message: String(e)}};
  }
  if (mine !== seq) return;
  D = d;
  if (d.parsed && d.parsed.source === "parser") { PARSED = d.parsed; panelFromParsed(d.parsed); }
  $("timings").classList.remove("busy");
  drawTimings(); drawPanel(); drawReading(); drawNotes(); drawResults(); drawClean();
}

// what the parser understood, for the Parsed view: the category, every filter and the residual phrases
function drawParsed() {
  if (!D.parsed) { $("cread").innerHTML = ""; return; }
  const args = !D.tree ? [] : D.tree.op === "and" ? D.tree.args : [D.tree];
  const filters = args.filter(a => a.feature !== "category").map(a => `<span class="cond">${treeHtml(a, false, false)}</span>`);
  const none = t => `<span class="meta">${t}</span>`;
  $("cread").innerHTML =
    `<div><h4>Category</h4><div class="vs">${D.parsed.category ? `<span class="leaf k-cat">${esc(D.parsed.category)}</span>` : none("none – outside the catalog")}</div></div>` +
    `<div><h4>Filters</h4><div class="vs">${filters.join("") || none("none")}</div></div>` +
    `<div><h4>Residual</h4><div class="vs">${D.parsed.residual.map(x => `<span class="rp">${esc(x)}</span>`).join("") || none("none")}</div></div>`;
}

function drawClean() {
  drawParsed();
  const g = $("cgrid"), note = t => `<div class="cnote">${esc(t)}</div>`;
  if (D.error) { g.innerHTML = note(`Something went wrong: ${D.error.message}`); return; }
  if (D.match === "out_of_catalog") { g.innerHTML = note(D.message); return; }
  if (!D.results || !D.results.length) { g.innerHTML = note("No products found."); return; }
  g.innerHTML = "";
  D.results.forEach(p => {
    const d = document.createElement("div"); d.className = "cp";
    d.innerHTML = `<div class="photo-frame">${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : ""}</div>` +
      `<div class="name" title="${esc(p.name)}">${esc(p.name)}</div>`;
    d.onclick = () => details(p);
    g.appendChild(d);
  });
}

// the stages on one time axis: the query embedding runs while the parser parses, Jev comes after the first stage
function drawTimings() {
  const t = D.timings || {}, total = t.total_ms || 0, pi = D.parser_info || {}, r = D.rerank;
  const manual = D.parsed && D.parsed.source === "manual";
  const pct = v => total ? Math.max(0, Math.min(100, 100 * v / total)) : 0;
  const row = (name, v, segs, title = "") => v === undefined || v === null ? "" :
    `<span title="${esc(title)}">${name}</span><div class="track">` +
    segs.map(([start, len, cls]) => `<i class="${cls}" style="left:${pct(start)}%;width:${pct(len)}%"></i>`).join("") +
    `</div><span class="v">${fmtMs(v)}</span>`;
  const p = manual ? 0 : t.parsing_ms || 0, f = t.filtering_ms || 0, jev = t.rerank_ms || 0;
  const first = t.ranking_ms === undefined ? undefined : t.ranking_ms - jev;
  const s1 = pi.step1_s == null ? null : pi.step1_s * 1000, s2 = pi.step2_s ? pi.step2_s * 1000 : null;
  let h = manual ? `<span>Parsing</span><span class="skip">skipped – filters set by hand</span>`
    : row("Parsing", t.parsing_ms, s1 !== null && s2 ? [[0, s1, "c-step1"], [s1, p - s1, "c-parse"]] : [[0, p, "c-parse"]],
          s1 !== null ? `step 1, category: ${fmtMs(s1)}` + (s2 ? ` · step 2, filters and residual: ${fmtMs(s2)}` : "") : "");
  h += row("Query embedding", t.query_embedding_ms, [[0, t.query_embedding_ms, "c-emb"]], "runs while the parser parses") +
    row("Filtering", t.filtering_ms, [[p, f, "c-filter"]], "the filters on the whole index") +
    row("Ranking", first, [[p + f, first, "c-rank"]], [t.embedding_wait_ms !== undefined ? `waited ${fmtMs(t.embedding_wait_ms)} for the query embedding` : "",
        t.bank_ms !== undefined ? `phrase bank ${fmtMs(t.bank_ms)}` : ""].filter(Boolean).join(" · ")) +
    (jev ? row("Jev rerank", jev, [[p + f + first, jev, "c-jev"]], "Jev regrades the first results") : "") +
    `<span class="sum">Total</span><span class="sum"></span><span class="v sum">${fmtMs(total)}</span>`;
  const costs = [!manual && pi.cost_usd ? ["parser", pi.cost_usd] : null,
                 r && r.status === "applied" && r.cost_usd != null ? ["Jev", r.cost_usd] : null].filter(Boolean);
  const usd = v => "$" + v.toFixed(4);
  const cost = !costs.length ? "" : `<div class="tlx" title="Billed by OpenRouter: the parser's step 1 and Jev; the parser's step 2: tokens × list price. The query embedding (about $0.00001) is not counted.">` +
    `Cost <b>${usd(costs.reduce((a, [, v]) => a + v, 0))}</b>` + (costs.length > 1 ? ` = ${costs.map(([k, v]) => `${k} ${usd(v)}`).join(" + ")}` : ` (${costs[0][0]})`) + `</div>`;
  $("timings").innerHTML = `<h3>Time</h3><div class="tl">${h}</div>` + cost;
}

// colour of a condition: category outlined, included green, excluded red
function leafKind(c, neg) {
  if (neg) return "k-not";
  return c.feature === "category" ? "k-cat" : "k-is";
}

function treeHtml(c, neg = false, top = true) {
  if (!c) return `<span class="meta">no conditions</span>`;
  if (c.feature !== undefined) {
    if (c.feature === "price") return `<span class="leaf ${leafKind(c, neg)}">price ${esc(PRICE_OPS[c.operator])} <b>${esc(c.value)}</b></span>`;
    const m = c.match || "any", single = c.values.length === 1 && m !== "exact";
    const op = m === "exact" ? "= only" : single ? "=" : m === "all" ? "⊇" : "∈";
    const v = single ? esc(c.values[0]) : `{${c.values.map(esc).join(", ")}}`;
    return `<span class="leaf ${leafKind(c, neg)}">${esc(c.feature)} ${op} <b>${v}</b></span>`;
  }
  if (c.op === "not") return `<span class="op k-not">NOT</span> ${treeHtml(c.arg, !neg, false)}`;
  const inner = c.args.map(a => treeHtml(a, neg, false)).join(` <span class="op">${c.op.toUpperCase()}</span> `);
  return top ? inner : `<span class="paren">(</span>${inner}<span class="paren">)</span>`;
}

// one top-level condition per line, prefixed with AND / AND NOT (red)
function treeLines(c) {
  const args = c.op === "and" ? c.args : [c];
  return `<div class="lines">` + args.map((a, i) => {
    const neg = a.op === "not", prefix = [i ? "AND" : "", neg ? "NOT" : ""].filter(Boolean).join(" ");
    return `<span class="op ${neg ? "k-not" : "k-is"}">${prefix}</span><span class="cond">${treeHtml(neg ? a.arg : a, neg, false)}</span>`;
  }).join("") + `</div>`;
}

// one residual phrase as the phrase bank read it: what it is and what the ranking uses of it
function phraseLine(r) {
  const how = r.match === "exact" ? "known phrase"
    : r.match === "nearest" ? `nearest: “${esc(r.neighbour)}” ${r.similarity.toFixed(2)}`
    : r.match === "concept" ? `concept name ${r.similarity.toFixed(2)}`
    : r.match === "colour" ? "modifies the colour after it"
    : r.match === "colour name" ? `colour name ${r.similarity.toFixed(2)}`
    : r.match === "detail name" ? `detail name ${r.similarity.toFixed(2)}`
    : `unknown, nearest ${r.similarity === null ? "–" : r.similarity.toFixed(2)}`;
  const c = r.colour, concepts = r.concepts.length ? `concepts <b>${r.concepts.map(esc).join(", ")}</b>` : "";
  const used = r.skipped ? `<span class="how">skipped (size or audience)</span>`
    : c && c.hex ? `colour <span class="swatch" style="background:${esc(c.hex)}"></span><b>${esc(c.name)}</b>`
    : c ? `${c.lightness === "light" ? "lighter" : "darker"} shades first`
    : r.detail ? `details <b>${r.detail.names.slice(0, 6).map(esc).join(", ")}</b>${r.detail.names.length > 6 ? ` +${r.detail.names.length - 6}` : ""}`
    : r.sentence ? [r.term === "concept" ? concepts : "", `best sentence of the description, as “${esc(r.sentence_text)}”`].filter(Boolean).join(" + ")
    : r.term ? concepts || `text “${esc(r.english)}”`
    : `<span class="how">covered by the whole query${r.concepts_unavailable.length ? `; no scores here for ${r.concepts_unavailable.map(esc).join(", ")}` : ""}</span>`;
  const said = r.bare ? `NOT ${esc(r.bare)}</span> <span class="how">(${esc(r.phrase)})</span>` : `${r.negated ? "NOT " : ""}${esc(r.phrase)}</span>`;
  const kind = r.kind || (r.match === "concept" ? "concept" : "");
  return `<div class="ph"><span class="said">${said} → ${used}<div class="how">${kind ? `${esc(kind)} · ` : ""}${how}</div></div>`;
}

function partKind(label) {
  const k = label.split(" · ")[0];
  return k === "concept" ? "k-con" : k === "colour" ? "k-col" : k === "detail" || k === "sentence" ? "k-det" : k === "negation" ? "k-neg" : "k-emb";
}

// how much each part of the score moves the ranking: its spread (standard deviation) over the candidates
function partsPanel() {
  const sp = D && D.score_parts;
  if (!sp || !sp.length) return "";
  const max = Math.max(...sp.map(x => x.spread)) || 1, w = D.weights;
  const formula = D.formula || (w ? `whole query (description, image, features) + ${w.concept} × concepts + ${w.colour} × colour + ${w.detail} × details − ${w.negation} × negations` : "whole query");
  const title = D.rerank && D.rerank.status === "applied" ? "First-stage score" : "Score";
  return `<h3>${title}<span>spread over ${num(D.counts.candidates)} candidates</span></h3><div class="how">= ${esc(formula)}</div>` +
    sp.map(x => `<div class="pr"><span class="lab" title="${esc(x.label)}">${esc(x.label)}</span><span class="v">±${x.spread.toFixed(2)}</span>` +
      `<div class="bar"><i class="${partKind(x.label)}" style="width:${Math.max(2, 100 * x.spread / max)}%"></i></div></div>`).join("");
}

// the parts of one product's score, right of the middle line when they raise it, left when they lower it
function scoreBar(p) {
  const e = Object.entries(p.parts || {});
  if (!e.length) return "";
  const scale = SCALE || 1;
  let pos = 50, neg = 50, h = "";
  for (const [l, v] of e) {
    const w = Math.min(50, 50 * Math.abs(v) / scale);
    if (v >= 0) { h += `<i class="${partKind(l)}" style="left:${pos}%;width:${w}%"></i>`; pos += w; }
    else { neg -= w; h += `<i class="${partKind(l)}" style="left:${neg}%;width:${w}%"></i>`; }
  }
  return `<div class="sbar" title="${esc(e.map(([l, v]) => `${l}: ${v >= 0 ? "+" : ""}${v.toFixed(2)}`).join("\n"))}">${h}<span class="zero"></span></div>`;
}

// how the query was read: its category, its filters, its residual phrases and the base of the whole-query similarity
function drawReading() {
  const manual = D.parsed && D.parsed.source === "manual";
  $("reading").hidden = !D.parsed;
  $("score").innerHTML = partsPanel(); $("score").hidden = !$("score").innerHTML;
  if (!D.parsed) return;
  const args = !D.tree ? [] : D.tree.op === "and" ? D.tree.args : [D.tree];
  const rest = args.filter(a => a.feature !== "category");
  const none = t => `<span class="meta">${t}</span>`;
  const phrases = D.bank ? D.bank.map(phraseLine).join("") : D.parsed.residual.map(x => `<div class="ph"><span class="said">${esc(x)}</span></div>`).join("");
  let h = `<span class="k">Category</span><span>${D.parsed.category ? `<span class="leaf k-cat">${esc(D.parsed.category)}</span>` : none("none – outside the catalog")}</span>`;
  if (D.tree) h += `<span class="k">Filters</span><span>${rest.length ? treeLines({op: "and", args: rest}) : none("none")}</span>`;
  if (D.parsed.category) h += `<span class="k">Phrases</span><span>${phrases || none("none – ranked by the whole query")}</span>`;
  if (D.base_query) h += `<span class="k">Base</span><span>“${esc(D.base_query)}” <span class="how">the whole query without its negated phrases</span></span>`;
  $("reading").innerHTML = `<h3>Query reading${manual ? "<span>filters set by hand</span>" : ""}</h3><div class="kv">${h}</div>`;
}

function drawNotes() {
  let h = "";
  if (D.error) h += `<div class="errorbox"><b>Error – stage: ${esc(D.error.stage)}</b><br>${esc(D.error.message)}</div>`;
  (D.warnings || []).forEach(w => h += `<div class="warn">⚠ ${esc(w)}</div>`);
  $("notes").innerHTML = h;
}

function drawResults() {
  $("banner").innerHTML = ""; $("grid").innerHTML = "";
  if (D.error || !D.results) { $("status").innerHTML = ""; return; }
  if (D.match === "out_of_catalog") {
    $("status").innerHTML = `<b>0 results</b>`;
    const catalog = Object.keys(INFO ? INFO.categories : {}), supported = INFO && INFO.parser_categories;
    const other = supported ? catalog.filter(c => !supported.includes(c)) : [];
    $("banner").innerHTML = `<div class="banner"><b>${esc(D.message)}</b><br>The catalog has: ${catalog.map(esc).join(", ")}.` +
      (other.length ? ` For queries it has not seen, the parser does not return ${other.map(esc).join(", ")}; pick it in Filters.` : "") + `</div>`;
    return;
  }
  const n = D.counts.candidates;
  $("status").innerHTML = `<b>${num(n)} ${n === 1 ? "result" : "results"}</b>`;
  if (!n) { $("grid").innerHTML = `<div class="empty">No products meet all the conditions.</div>`; return; }
  const g = $("grid");
  // the longest side of any product's bar fills half of the bar
  const side = (p, sign) => Object.values(p.parts || {}).reduce((a, v) => a + Math.max(sign * v, 0), 0);
  SCALE = D.results.reduce((m, p) => Math.max(m, side(p, 1), side(p, -1)), 1e-9);
  D.results.forEach((p, i) => g.appendChild(card(p, i)));
}

function card(p, i) {
  const d = document.createElement("div"); d.className = "p";
  const from = !p.rerank || p.rerank.image_used === undefined ? "" : p.rerank.image_used ? ", from the text and photo" : ", from the text only";
  const chips = [p.rerank ? `<span class="chip jv" title="expected Jev grade, 0–3${from}">Jev ${p.rerank.grade.toFixed(2)}</span>` : "",
    ...p.concepts.map(c => `<span class="chip cc">${esc(c.name)} ${c.score}/10</span>`),
    ...(p.details || []).map(x => `<span class="chip dt">${esc(x.name)} · ${esc(x.extent)}</span>`)].join("");
  // the score the result is ordered by: after Jev, its grade plus the weighted first-stage z-score
  const jev = p.rerank && D.rerank, final = p.rerank ? p.rerank.score : p.score;
  const how = jev ? `final score = Jev grade ${p.rerank.grade.toFixed(2)} + ${jev.blend} × first-stage z-score ${((p.rerank.score - p.rerank.grade) / jev.blend).toFixed(2)}`
    : D.rerank && D.rerank.status === "applied" ? "first-stage score; Jev regraded only the results above" : "score: the sum of the parts in the bar";
  d.innerHTML = `<span class="nr">${i + 1}</span><span class="sc${jev ? " jv" : ""}" title="${esc(how)}">${final.toFixed(2)}</span>` +
    `<div class="photo-frame">${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : ""}</div>` +
    `<div class="t"><b>${esc(p.name)}</b><div class="meta">${esc(p.brand)}${p.price ? " · " + esc(p.price) : ""}</div>` +
    (chips ? `<div class="chips">${chips}</div>` : "") + scoreBar(p) + `</div>`;
  d.onclick = () => details(p);
  return d;
}

$("panel").onclick = e => { if (e.target.id === "panel") $("panel").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("panel").classList.remove("on"); });

async function details(k) {
  $("box").innerHTML = `<div class="meta">Loading…</div>`; $("panel").classList.add("on");
  const r = await fetch("/api/product?id=" + encodeURIComponent(k.id), noCache), p = await r.json();
  if (!r.ok) { $("box").innerHTML = `<div class="errorbox">${esc(p.error ? p.error.message : r.status)}</div>`; return; }
  const hit = new Set(k.matched), chosen = new Set(k.concepts.map(c => c.name)), asked = new Set((k.details || []).map(x => x.name));
  const dev = VIEW === "dev";
  $("box").innerHTML = `<button class="close" onclick="document.getElementById('panel').classList.remove('on')">Close</button>` +
    `<h2>${esc(p.name)}</h2><div class="meta">${esc(p.brand)}${k.price ? " · " + esc(k.price) : ""}${dev ? " · " + esc(p.category) : ""}</div>` +
    `<div class="photos">${p.images.map(z => `<div class="photo-frame"><img loading="lazy" src="${esc(z)}" alt=""></div>`).join("")}</div>` +
    (p.description ? `<p class="desc">${esc(p.description)}</p>` : "") + (!dev ? "" :
    (k.rerank ? `<h3>Jev reranking</h3><p>Expected grade: ${k.rerank.grade.toFixed(2)}/3 · rerank score: ${k.rerank.score.toFixed(2)}${k.rerank.image_used === undefined ? "" : k.rerank.image_used ? " · text + photo" : " · text only"}</p>` : "") +
    (Object.keys(k.parts || {}).length ? `<h3>${D.rerank && D.rerank.status === "applied" ? "First-stage score" : "Score"} ${k.score.toFixed(2)}: its parts</h3><table>${Object.entries(k.parts).map(([l, v]) =>
      `<tr><td><span class="swatch ${partKind(l)}" style="border:0"></span>${esc(l)}</td><td>${v >= 0 ? "+" : ""}${v.toFixed(2)}</td></tr>`).join("")}</table>` : "") +
    ((p.details || []).length ? `<h3>Details (Gemini)</h3><div class="dlist">${p.details.map(x =>
      `<span class="chip dt${asked.has(x.name) ? " on" : ""}">${esc(x.name)} · ${esc(x.extent)}</span>`).join("")}</div>` : "") +
    ((p.colours || []).length ? `<h3>Colours (Gemini)</h3><table>${p.colours.map(c =>
      `<tr><td><span class="swatch" style="background:${esc(c.hex)}"></span>${esc(c.name)}</td><td>${esc(c.family)} · ${esc(c.hex)} · ${Math.round(c.share * 100)}%</td></tr>`).join("")}</table>` : "") +
    `<table>${Object.entries(p.features).map(([c, v]) => `<tr class="${hit.has(c) ? "on" : ""}"><td>${esc(c)}</td><td>${esc(v)}</td></tr>`).join("")}</table>` +
    (p.concepts.length ? `<h3>Concept scores</h3><table>${p.concepts.map(c =>
      `<tr class="${chosen.has(c.name) ? "on" : ""}"><td>${esc(c.name)}</td><td>${c.score}/10</td></tr>`).join("")}</table>` : ""));
}
</script></body></html>
