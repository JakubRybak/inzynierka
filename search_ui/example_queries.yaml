# Example queries shown in the UI. The parser supports the first three categories; the queries cover several
# features, OR, exclusion, "and" for colors, Polish, price and a residual that only the ranking sees. For the other
# categories the parser returns no category, and the category is picked in the filter panel.

T-shirts:
  - black oversized cotton t-shirt for men
  - floral or striped t-shirt
  - long sleeve t-shirt without polyester
  - biała koszulka z długim rękawem
  - black cotton t-shirt under 200 dollars
  - t-shirt with a skull print
Dresses:
